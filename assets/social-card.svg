<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Grid -->
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#1b2a37" />
    </pattern>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36d6c8" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1722" />
      <stop offset="100%" stop-color="#080d14" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="cardGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#36d6c8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#36d6c8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="#070c12" />
  <rect width="1280" height="640" fill="url(#cardGrid)" />
  <rect width="1280" height="640" fill="url(#cardGlow)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="1276" height="636" rx="16" fill="none" stroke="#1f3142" stroke-width="2" />

  <!-- LEFT COLUMN: TITLE & SPECS -->
  <g transform="translate(80, 100)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#122332" stroke="#36d6c8" stroke-width="1" />
    <text x="110" y="21" class="mono" font-size="13" font-weight="700" fill="#36d6c8" text-anchor="middle" letter-spacing="1.5">SYSTEMS DAEMON</text>

    <!-- Main Title -->
    <text x="0" y="90" class="sans" font-size="58" font-weight="800" fill="#f0f6fc" letter-spacing="-1">MiniCache</text>
    <rect x="0" y="108" width="280" height="4" rx="2" fill="url(#cyanBlue)" />

    <!-- Subtitle -->
    <text x="0" y="150" class="sans" font-size="22" font-weight="400" fill="#c9d1d9">
      In-Memory Key-Value Store in Java 21
    </text>
    <text x="0" y="180" class="sans" font-size="18" font-weight="400" fill="#8b949e">
      Built from first principles with zero third-party dependencies.
    </text>

    <!-- Architecture Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="4" fill="#36d6c8" />
        <text x="24" y="15" class="mono" font-size="14" fill="#f0f6fc">Custom Separate-Chaining Hash Table</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(0, 36)">
        <circle cx="10" cy="10" r="4" fill="#36d6c8" />
        <text x="24" y="15" class="mono" font-size="14" fill="#f0f6fc">O(1) LRU Doubly-Linked List with Sentinels</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(0, 72)">
        <circle cx="10" cy="10" r="4" fill="#36d6c8" />
        <text x="24" y="15" class="mono" font-size="14" fill="#f0f6fc">Redis RESP Wire Protocol over Raw TCP</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(0, 108)">
        <circle cx="10" cy="10" r="4" fill="#36d6c8" />
        <text x="24" y="15" class="mono" font-size="14" fill="#f0f6fc">Multi-Threaded ServerSocket Listener (Port 6379)</text>
      </g>
    </g>

    <!-- Footer metadata -->
    <text x="0" y="440" class="mono" font-size="13" fill="#8b949e">Author: Abhinav Kishore (@logicbyabhinav) · MIT License</text>
  </g>

  <!-- RIGHT COLUMN: INTERACTIVE TERMINAL PREVIEW -->
  <g transform="translate(680, 90)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="520" height="460" rx="12" fill="url(#termBg)" stroke="#22374a" stroke-width="2" />

    <!-- Terminal Title Bar -->
    <rect x="0" y="0" width="520" height="38" rx="12" fill="#142230" />
    <path d="M0 28 h520 v10 h-520 z" fill="#142230" />
    <line x1="0" y1="38" x2="520" y2="38" stroke="#22374a" stroke-width="1" />

    <!-- Window Buttons -->
    <circle cx="20" cy="19" r="6" fill="#ff5f56" />
    <circle cx="40" cy="19" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="19" r="6" fill="#27c93f" />

    <text x="260" y="24" class="mono" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">redis-cli -p 6379 (Live Session)</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 70)" class="mono" font-size="13">
      <!-- Command 1 -->
      <text x="0" y="0" fill="#36d6c8" font-weight="700">127.0.0.1:6379&gt; PING</text>
      <text x="0" y="22" fill="#f0f6fc">PONG</text>
      <text x="0" y="40" fill="#6e7681" font-size="11">&gt;&gt; [wire bytes: +PONG\r\n]</text>

      <!-- Command 2 -->
      <text x="0" y="80" fill="#36d6c8" font-weight="700">127.0.0.1:6379&gt; SET user "abhinav" EX 60</text>
      <text x="0" y="102" fill="#27c93f" font-weight="700">OK</text>
      <text x="0" y="120" fill="#6e7681" font-size="11">&gt;&gt; [wire bytes: +OK\r\n]</text>

      <!-- Command 3 -->
      <text x="0" y="160" fill="#36d6c8" font-weight="700">127.0.0.1:6379&gt; GET user</text>
      <text x="0" y="182" fill="#58a6ff" font-weight="700">"abhinav"</text>
      <text x="0" y="200" fill="#6e7681" font-size="11">&gt;&gt; [wire bytes: $7\r\nabhinav\r\n]</text>

      <!-- Command 4 -->
      <text x="0" y="240" fill="#36d6c8" font-weight="700">127.0.0.1:6379&gt; EXISTS user</text>
      <text x="0" y="262" fill="#f0f6fc">(integer) 1</text>
      <text x="0" y="280" fill="#6e7681" font-size="11">&gt;&gt; [wire bytes: :1\r\n]</text>

      <!-- Command 5 -->
      <text x="0" y="320" fill="#36d6c8" font-weight="700">127.0.0.1:6379&gt; DEL user</text>
      <text x="0" y="342" fill="#f0f6fc">(integer) 1</text>
      <text x="0" y="360" fill="#6e7681" font-size="11">&gt;&gt; [wire bytes: :1\r\n]</text>
    </g>
  </g>
</svg>
